[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geomem-models"
version = "0.1.0"
description = "Memory models, temporal bases, readouts, and recurrent diagnostics for GeoMem."
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
